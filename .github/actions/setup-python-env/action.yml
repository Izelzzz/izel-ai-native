name: setup-python-env
description: Install the uv version pinned in pyproject.toml, Python, and the locked environment.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.12"
    - run: uv sync --locked
      shell: bash
